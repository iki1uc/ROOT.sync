:root {
  --bg: #05070a;
  --surface: #0a0e14;
  --surface-2: #0d1219;
  --line: #1c2635;
  --gold: #ffcc44;
  --cyan: #22e6ff;
  --ink: #e8eef7;
  --muted: #7d8aa0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #05070a;
    --surface: #0a0e14;
    --surface-2: #0d1219;
    --line: #1c2635;
    --gold: #ffcc44;
    --cyan: #22e6ff;
    --ink: #e8eef7;
    --muted: #7d8aa0;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}
/* ---------- GLITCH ---------- */
.glitch {
  position: relative;
  display: inline-block;
}
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.glitch::before {
  color: var(--cyan);
  z-index: -1;
  animation: glitch-shift-a 3.2s infinite steps(1);
}
.glitch::after {
  color: var(--gold);
  z-index: -2;
  animation: glitch-shift-b 2.7s infinite steps(1);
}
@keyframes glitch-shift-a {
  0%, 86% {
    transform: translate(0, 0);
    clip-path: inset(0 0 0 0);
    opacity: 0;
  }
  87% {
    transform: translate(-3px, 1px);
    clip-path: inset(12% 0 55% 0);
    opacity: .85;
  }
  89% {
    transform: translate(3px, -1px);
    clip-path: inset(60% 0 8% 0);
    opacity: .85;
  }
  91% {
    transform: translate(-2px, 0);
    clip-path: inset(30% 0 40% 0);
    opacity: .7;
  }
  93%, 100% {
    transform: translate(0, 0);
    opacity: 0;
  }
}
@keyframes glitch-shift-b {
  0%, 78% {
    transform: translate(0, 0);
    opacity: 0;
  }
  79% {
    transform: translate(3px, 0);
    clip-path: inset(45% 0 25% 0);
    opacity: .8;
  }
  81% {
    transform: translate(-3px, 1px);
    clip-path: inset(5% 0 75% 0);
    opacity: .8;
  }
  83%, 100% {
    transform: translate(0, 0);
    opacity: 0;
  }
}
/* ---------- SCANLINES ---------- */
.scanlines::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(34, 230, 255, 0.025) 4px
  );
  mix-blend-mode: screen;
}
.scanbeam {
  position: absolute;
  left: 0;
  right: 0;
  height: 90px;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, rgba(34,230,255,0.05), transparent);
  animation: beam 7s linear infinite;
}
@keyframes beam {
  0% {
    top: -15%;
  }
  100% {
    top: 110%;
  }
}
/* ---------- RAVEN ---------- */
@keyframes raven-bob {
  0%, 100% {
    transform: translateY(0) rotate(-1deg);
  }
  50% {
    transform: translateY(-7px) rotate(1.2deg);
  }
}
.raven-bob {
  animation: raven-bob 5s ease-in-out infinite;
}
@keyframes raven-flap {
  0%, 100% {
    transform: rotate(0deg);
  }
  50% {
    transform: rotate(-7deg);
  }
}
.raven-wing {
  transform-origin: 62% 42%;
  animation: raven-flap 5s ease-in-out infinite;
}
/* ---------- FEATHER ---------- */
@keyframes feather-fall {
  0% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 0;
  }
  8% {
    opacity: 1;
  }
  25% {
    transform: translate(-26px, 90px) rotate(38deg);
  }
  50% {
    transform: translate(14px, 185px) rotate(-24deg);
  }
  75% {
    transform: translate(-16px, 275px) rotate(30deg);
  }
  100% {
    transform: translate(0, 355px) rotate(12deg);
    opacity: 1;
  }
}
.feather-falling {
  animation: feather-fall 2.8s cubic-bezier(.4,.05,.6,1) forwards;
}
@keyframes feather-rest {
  0% {
    opacity: 1;
    filter: drop-shadow(0 0 10px rgba(255,204,68,.75));
  }
  70% {
    opacity: .85;
  }
  100% {
    opacity: 0;
    filter: drop-shadow(0 0 2px rgba(255,204,68,0));
  }
}
.feather-resting {
  animation: feather-rest 4.5s ease-out forwards;
}
/* ---------- EYE GLOW ---------- */
@keyframes iris-pulse {
  0%, 100% {
    opacity: .55;
  }
  50% {
    opacity: 1;
  }
}
.iris-pulse {
  animation: iris-pulse 2.4s ease-in-out infinite;
}
@keyframes blink-caret {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
.caret {
  animation: blink-caret 1.1s steps(1) infinite;
}
@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.fade-up {
  animation: fade-up .8s ease-out both;
}
